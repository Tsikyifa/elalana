{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            Nouvelle demande d'audience
        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    class="btn btn-primary">
                    Enregistrer
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
