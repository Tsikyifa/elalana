{% if view_type == 'titulaire' %}

    {% for titulaire, axes in titulaire_structure.items %}

        <div class="region-section mb-5">

            <h4 class="mt-4 text-success border-bottom pb-2">
                <i class="bi bi-person-badge-fill"></i>
                {{ titulaire|upper }}
            </h4>

            {% for axe, marches_list in axes.items %}

                <div class="ms-3 mb-4">

                    <div class="d-flex justify-content-between align-items-center bg-light p-2 rounded border-start border-4 border-success mb-2">
                        <strong>{{ axe }}</strong>
                    </div>

                    <div class="table-responsive table-container">

                            {% include "reporting/affich_part/tableau_marche.html" with marches_list=marches_list %}

                    </div>

                </div>

            {% endfor %}

        </div>

    {% endfor %}

{% endif %}
