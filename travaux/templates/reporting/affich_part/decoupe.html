{% if view_type == 'pk' %}
{% for axe, segments in pk_structure.items %}
    <h3 class="mt-4 text-primary border-bottom pb-2">
        <i class="bi bi-road-network"></i> AXE : {{ axe }}
    </h3>
    <div class="table-responsive table-container">

                            {% include "reporting/affich_part/tableau_marche.html" with marches_list=segments %}

    </div>

{% empty %}
    <p class="alert alert-warning">Aucun découpage PK trouvé.</p>
{% endfor %}

{% endif %}
