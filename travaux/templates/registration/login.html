<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion | Système de Reporting</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            width: 420px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            color: white;
        }

        .login-card h3 {
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
        }

        .form-control:focus {
            box-shadow: 0 0 0 2px rgba(255,255,255,0.4);
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .form-control::placeholder {
            color: #ddd;
        }

        .btn-login {
            border-radius: 10px;
            background-color: #ffffff;
            color: #1e3c72;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #e3e3e3;
        }

        .input-group-text {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            border-radius: 10px 0 0 10px;
        }

        .alert {
            border-radius: 10px;
        }

        .footer-text {
            font-size: 13px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="login-card text-center">

    <div class="mb-4">
        <i class="bi bi-bar-chart-line-fill" style="font-size: 40px;"></i>
        <h3 class="mt-2">Système de Reporting</h3>
        <p class="footer-text">Gestion et suivi des marchés publics</p>
    </div>

    {% if form.errors %}
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Nom d'utilisateur ou mot de passe incorrect.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <!-- Username -->
        <div class="mb-3 input-group">
            <span class="input-group-text">
                <i class="bi bi-person-fill"></i>
            </span>
            {{ form.username }}
        </div>

        <!-- Password -->
        <div class="mb-4 input-group">
            <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
            </span>
            {{ form.password }}
        </div>

        <button type="submit" class="btn btn-login w-100 py-2">
            <i class="bi bi-box-arrow-in-right"></i> Se connecter
        </button>
    </form>

    <div class="mt-4 footer-text">
        © {{ now|date:"Y" }} - Ministère des Travaux
    </div>

</div>

</body>
</html>
