<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    <script>
      // Pose le thème avant le premier rendu : sans ça, un utilisateur en mode
      // sombre verrait un flash clair pendant la vérification de session.
      (function () {
        try {
          var pref = localStorage.getItem('elalana-theme')
          var dark =
            pref === 'dark' ||
            (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.dataset.bsTheme = theme
        } catch (error) {
          /* stockage indisponible : on reste sur le thème clair par défaut */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
